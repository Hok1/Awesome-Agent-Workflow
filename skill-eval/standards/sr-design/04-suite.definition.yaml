    rubric: "# SR 设计文档质量测评标准 —— RBS 国密 SM2 算法支持（SR-1）\n\n> 版本：v1.0（2026-09-11）\n> 用途：作为 skill-eval 测评平台对 `sr-design` skill 打分的输入标准。\n> 立场：需求设计者视角。不问\"文档齐不齐\"，只问\"照这份文档开工，业务会不会翻车\"。\n\n---\n\n## 0. 被测评需求是什么\n\n- **SR 编号**：SR-1\n- **需求原文**：\n  1. SR编号：SR-1\n  2. 需求简介：目前 SM2 算法没有用于此代码仓中。需要在用户认证支持 SM2 算法、验证 GTA 签发的 SM2 attestation token、rbs-cli 生成 SM2 token。\n- **代码仓**：`globaltrustauthority-rbs`（分支 `master`，基线 commit `7ef62cd`）\n- **交付物**：`.sdd/SR-1/SR-design.md`（由 `sr-design` skill 依据 `reference/design-template.md` 生成）\n\n**这项需求的业务实质**：让 RBS 具备\"用国密 SM2 做身份\"的能力，从而能部署进要求国密合规（GB/T 32918 / GB/T 32905）的客户环境。三个触点——用户认证走 SM2、校验 GTA 签发的 SM2 attestation token、rbs-cli 能造 SM2 token。\n\n**为什么它风险高**：\n1. **互操作是硬约束，且失败发生在客户现场。** RBS 不是 token 的签发方，GTA 才是。RBS 只能被动接受 GTA 的编码约定。约定写错一个字（DER 还是 r‖s、签名输入是否预哈希、Z 值 UserId 取什么），代码全绿、单测全过，一到真实 GTA token 上就验签失败——而此时已经发货。\n2. **合规范围没有天然边界。** 客户口中的\"支持国密\"可能只指签名，也可能连带要求 SM3 独立使用、SM4 加密、双证书体系。范围如果不在设计阶段钉死，验收时就是无底洞。\n3. **这是一次信任边界变更。** 引入 SM2 意味着 RBS 要接受一类新的密钥材料与签名格式，密钥泄露的应急路径、无吊销列表的后果，都必须作为业务决策写清楚，而不是藏在运维备注里。\n\n---\n\n## 1. 打分总则（judge 必读）\n\n1. **逐条判定，不得合并成笼统印象分。** 每个维度按下面的判据独立给分，并在 `evidence` 中引用被评文档的**原文片段或章节编号**。引用不到原文的判定视为无效。\n2. **空壳不得分。** 章节标题存在但内容为占位符、套话、或只有表格表头，该维度直接判 **≤30**，无论篇幅多长。\n3. **准确比详尽值钱。** 写了但写错的事实，扣分应当**重于**没写。尤其：与代码/契约实际行为相悖的描述，该维度判 **≤20**。\n4. **诚实加分。** 明确写出\"不适用：<可追溯依据>\"、或明确标注\"未确认、待澄清\"的地方，不扣分（主干章节除外，见 HG-4）。把不确定性写清楚，比编一个答案有价值。\n5. **禁止用目录结构冒充内容。** 文档章节齐全、mermaid 图精美，都不是加分项本身；只有它们承载的信息正确且够用时才算。\n6. **0-100 分锚点**：90+ = 可直接作为下游开发与验收的唯一依据；70-89 = 基本可用，存在需澄清的缺口；50-69 = 有骨架但关键契约/验收不可依赖；30-49 = 形式完整、实质空转；<30 = 缺失或误导。\n\n---\n\n## 2. 硬性门槛（一票否决项）\n\n以下四项各自独立判定**通过 / 不通过**，不通过即说明该文档不能作为开发依据，须在结论中显式列出。\n\n### HG-1 交付范围必须钉死\n文档必须明确写出本次交付**包含**哪些国密算法能力、**不包含**哪些，并对不包含项给出依据（需求未要求 / 依赖三方件不支持 / 留待后续 SR）。\n具体最低要求：至少正面回答 SM2 签名/验签是否包含、SM3 是否作为独立能力（非仅 SM2 内部摘要）交付、SM4 是否在范围内、证书/双证书体系是否涉及。\n\n**判不通过的情形**：只描述要做什么，从不划定边界；或通篇只谈 SM2 但对 SM3/SM4/证书的处置完全沉默，导致验收范围无法确定。\n\n### HG-2 GTA 签名契约必须精确到可互操作\n文档必须把\"RBS 如何校验 GTA 签发的 SM2 token\"写到一个工程师能据此直接实现的程度，且关键约定**不得与代码现有事实相矛盾**。必须覆盖：签名值的编码形式、签名输入的字节范围、SM3 的 Z 值（UserId）取值、算法标识与白名单、公钥格式与分发方式、时钟容差。\n\n**判不通过的情形**：缺少上述任一项；或写了但与仓库现有实现/契约（如 `rbs/core/src/auth/authn/sm2_algorithm.rs` 中的签名格式处理）相矛盾；或关键项写成\"参照标准\"而无具体取值。\n\n### HG-3 关键规格必须逐条可验收\n文档\"关键规格\"章节中的每一条量化规格，都必须映射到验收用例编号；且该用例必须是**能真正证伪这条规格**的黑盒用例（用外部手段驱动、断言在系统外表面）。\n\n**判不通过的情形**：出现无法被任何用例验证的规格；或用例引用了却根本不具备验证该规格能力（例如规格讲 Z 值，引用的用例却是\"注册后凭 token 访问成功\"这种对 Z 值不敏感的连通性用例）；或存在规格未被任何用例覆盖。\n\n### HG-4 验收必须闭环\n验收用例集必须覆盖六类对象（① 功能主成功场景 ② 异常/冲突/兼容场景 ③ 对外接口契约 ④ 数据一致性 ⑤ DFX 量化阈值 ⑥ 原始需求明确要求的可验收行为），且\"主流程 / 功能定位 / 对外接口 / 关键规格 / 模块划分与职责 / SR 整体验收标准\"六个主干章节不得标注\"不适用\"。每个原始需求触点都必须有对应用例。\n\n**判不通过的情形**：六类对象缺任一类；主干章节被判\"不适用\"；三个原始需求触点（用户认证支持 SM2 / 验证 GTA SM2 token / rbs-cli 生成 SM2 token）有任一无对应用例。\n\n---\n\n\n\n---\n**本次只评测以下一项**\n\n按【硬性门槛】逐项判定，只对下列一项给分。\nHG-2：文档须把\"RBS 如何校验 GTA 签发的 SM2 token\"写到可直接实现的程度，且关键约定不得与仓库现有代码事实相矛盾。必须覆盖六项：签名值编码形式、签名输入的字节范围、SM3 的 Z 值(UserId)取值、算法标识与白名单、公钥格式与分发方式、时钟容差。\n80-100 = 六项俱备且给具体取值；50-79 = 覆盖主要项但个别项只有定性描述；10-49 = 关键约定缺失过半或与代码事实矛盾；0-9 = 未形成互操作契约。\n0-49 即视为该门槛不通过。\n\n---\n**结论必须包含**：该项门槛是否通过（通过/不通过），以及引用的原文证据。"
    timeout_seconds: 300
