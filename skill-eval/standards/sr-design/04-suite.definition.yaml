      85-100：逐项给具体取值，并写明取值来源（代码位置/GTA侧契约/问题池决策）。

      60-84：覆盖主要项，但个别项只有定性描述（如"按标准SM2处理"）或未给默认值。

      30-59：只写"用SM2验签"，关键约定缺失过半。

      0-29：未形成互操作契约，或存在与现有代码事实直接矛盾的描述。

      关键：与仓库实际行为相悖的描述，本项判 20 分以下。'
    timeout_seconds: 300
