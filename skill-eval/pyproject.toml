[project]
name = "aaw-skill-eval"
version = "0.1.0"
description = "Local single-candidate Agent Skill benchmark platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0.36,<3",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6.0.2,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[project.scripts]
aaw-skill-eval = "aaw_skill_eval.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aaw_skill_eval = ["static/*", "static/benchmark/*", "static/benchmark/assets/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
