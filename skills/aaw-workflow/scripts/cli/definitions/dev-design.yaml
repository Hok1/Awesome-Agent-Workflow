name: dev-design
execution: skill
skill: [dev-design]
input:
  - path: ".sdd/{SR}/requirement.md"
    required: false
  - path: ".sdd/software_architecture.md"
    required: false
output:
  - path: ".sdd/{SR}/dev-design.md"
    required: true
data_prompt:
  description: "个人开发者轻量设计：一份 dev-design.md 覆盖需求、现状摘要、方案、契约变更、影响面和验收标准。必经 ASIS 代码取证，先读需求与架构、再取证代码、把现状摘要写在需求与方案之间、全量取证细节写进文末现状附录，最后基于取证结果向用户提问。不区分档位，篇幅由需求复杂度自然决定。无需提交额外数据，交付件写好即可 done。"
